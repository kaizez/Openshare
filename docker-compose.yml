services:
  # ============================================
  # Auth Database (Separate MySQL instance)
  # ============================================
  auth-db:
    image: mysql:8.0
    container_name: moveit-auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-your_secure_password}
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moveit-network

  # ============================================
  # Working Database (FileTransfer primary DB)
  # ============================================
  working-db:
    image: mysql:8.0
    container_name: moveit-working-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${WORKING_DB_ROOT_PASSWORD:-WorkingRoot2024!}
      MYSQL_DATABASE: ${WORKING_DB_NAME:-workingdb}
      MYSQL_USER: ${WORKING_DB_USER:-working_user}
      MYSQL_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
    ports:
      - "3309:3306"
    volumes:
      - working_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
      - sync_network

  # ============================================
  # Storage Database (Isolated - NO external ports)
  # ============================================
  storage-db:
    image: mysql:8.0
    container_name: moveit-storage-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${STORAGE_DB_ROOT_PASSWORD:-StorageRoot2024!}
      MYSQL_DATABASE: ${STORAGE_DB_NAME:-storagedb}
      MYSQL_USER: ${STORAGE_DB_USER:-storage_user}
      MYSQL_PASSWORD: ${STORAGE_DB_PASSWORD:-storage_pass_2024}
    volumes:
      - storage_db_data:/var/lib/mysql
    networks:
      - sync_network  # ONLY sync_network - isolated
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Main Application (Auth + FileTransfer)
  # ============================================
  app:
    build: .
    container_name: moveit-app
    restart: always
    ports:
      - "5005:5000"
    environment:
      DOCKER_ENV: "true"
      URL_SCHEME: "https"
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      # Auth Database (separate MySQL)
      MYSQL_HOST: auth-db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-your_secure_password}
      MYSQL_DATABASE: auth_db
      # FileTransfer Working Database (separate MySQL)
      WORKING_DB_HOST: working-db
      WORKING_DB_PORT: 3306
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      # VirusTotal
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_ENABLED: ${VIRUSTOTAL_ENABLED:-true}
      VIRUSTOTAL_TIMEOUT: ${VIRUSTOTAL_TIMEOUT:-60}
      # Email config
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@moveit.com}
      # reCAPTCHA
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # Google OAuth
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Force Python to not buffer stdout/stderr
      PYTHONUNBUFFERED: "1"
    depends_on:
      auth-db:
        condition: service_healthy
      working-db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./FileTransfer:/app/FileTransfer
      - ./uploads:/app/uploads
      - encryption_keys:/app/keys
    networks:
      - moveit-network
      - app_network

  # ============================================
  # Sync Service - Bridges Working DB to Storage DB
  # ============================================
  sync-service:
    build:
      context: ./FileTransfer
      dockerfile: Dockerfile.sync
    container_name: moveit-sync
    restart: always
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      STORAGE_DB_HOST: storage-db
      STORAGE_DB_USER: ${STORAGE_DB_USER:-storage_user}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:-storage_pass_2024}
      STORAGE_DB_NAME: ${STORAGE_DB_NAME:-storagedb}
      STORAGE_DB_PORT: 3306
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      DELETE_FILES_OLDER_THAN_SECONDS: ${DELETE_FILES_OLDER_THAN_SECONDS:-0}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8081:8080"
    networks:
      - sync_network
      - app_network
    depends_on:
      working-db:
        condition: service_healthy
      storage-db:
        condition: service_healthy

  # ============================================
  # VirusTotal Background Worker
  # ============================================
  vt-worker:
    build:
      context: ./FileTransfer
      dockerfile: Dockerfile
    container_name: moveit-vt-worker
    restart: always
    command: python3 vt_worker.py
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_ENABLED: ${VIRUSTOTAL_ENABLED:-true}
      VT_WORKER_INTERVAL: ${VT_WORKER_INTERVAL:-10}
      PYTHONUNBUFFERED: "1"
    networks:
      - app_network
    depends_on:
      working-db:
        condition: service_healthy
  siem-dashboard:
    build:
      context: ./siem_dashboard
    container_name: moveit-siem-dashboard
    restart: always
    ports:
      - "5002:5001"
    environment:
      SIEM_URL: ${SIEM_URL}
      SIEM_DASHBOARD_SECRET: ${SIEM_DASHBOARD_SECRET:-change-this}
    networks:
      - moveit-network

networks:
  moveit-network:
    driver: bridge
  app_network:
    driver: bridge
  sync_network:
    driver: bridge
    internal: true  # Isolated - no external access

volumes:
  auth_db_data:
  working_db_data:
  storage_db_data:
  encryption_keys:
