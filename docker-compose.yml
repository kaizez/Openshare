services:
  # ============================================
  # Auth Database (Separate MySQL instance)
  # ============================================
  auth-db:
    image: mysql:8.0
    container_name: openshare-auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - openshare-network

  # ============================================
  # Working Database (FileTransfer primary DB)
  # ============================================
  working-db:
    image: mysql:8.0
    container_name: openshare-working-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${WORKING_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORKING_DB_NAME:-workingdb}
      MYSQL_USER: ${WORKING_DB_USER:-working_user}
      MYSQL_PASSWORD: ${WORKING_DB_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - working_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
      - sync_network

  # ============================================
  # Storage Database (Isolated - NO external ports)
  # ============================================
  storage-db:
    image: mysql:8.0
    container_name: openshare-storage-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${STORAGE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${STORAGE_DB_NAME:-storagedb}
      MYSQL_USER: ${STORAGE_DB_USER:-storage_user}
      MYSQL_PASSWORD: ${STORAGE_DB_PASSWORD}
    volumes:
      - storage_db_data:/var/lib/mysql
    networks:
      - sync_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  movelorh-db: # Renamed from working-db
    image: mysql:8.0
    container_name: openshare-movelorh-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MOVELORH_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOVELORH_DB_NAME:-movedb}
      MYSQL_USER: ${MOVELORH_DB_USER:-move_user}
      MYSQL_PASSWORD: ${MOVELORH_DB_PASSWORD}
    ports:
      - "3310:3306" # External access via 3310
    volumes:
      - movelorh_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
      - sync_network
  # ============================================
  # Main Application (Auth + FileTransfer)
  # ============================================
  app:
    build: .
    container_name: openshare-app
    restart: always
    ports:
      - "5005:5000"
    environment:
      DOCKER_ENV: "true"
      URL_SCHEME: "https"
      SECRET_KEY: ${SECRET_KEY}
      # Auth Database
      MYSQL_HOST: auth-db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${AUTH_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: auth_db
      # FileTransfer Working Database
      WORKING_DB_HOST: working-db
      WORKING_DB_PORT: 3306
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      
      # AI Engine Connection
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      # VirusTotal
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_ENABLED: ${VIRUSTOTAL_ENABLED:-true}
      VIRUSTOTAL_TIMEOUT: ${VIRUSTOTAL_TIMEOUT:-60}
      # Email config
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-noreply@openshare.com}
      # reCAPTCHA
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # Google OAuth
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Retention Policy
      RETENTION_CONFIG_PATH: /app/config/retention_policy.json
      # SIEM
      SIEM_URL: ${SIEM_URL}
      SIEM_API_KEY: ${SIEM_API_KEY:-}
      PYTHONUNBUFFERED: "1"
    depends_on:
      auth-db:
        condition: service_healthy
      working-db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./FileTransfer:/app/FileTransfer
      - ./uploads:/app/uploads
      - encryption_keys:/app/keys
      - retention_config:/app/config
    networks:
      - openshare-network
      - app_network

  # ============================================
  # Sync Service - Bridges Working DB to Storage DB
  # ============================================
  sync-service:
    build:
      context: ./FileTransfer
      dockerfile: Dockerfile.sync
    container_name: openshare-sync
    restart: always
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      STORAGE_DB_HOST: storage-db
      STORAGE_DB_USER: ${STORAGE_DB_USER:-storage_user}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      STORAGE_DB_NAME: ${STORAGE_DB_NAME:-storagedb}
      STORAGE_DB_PORT: 3306
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      DELETE_FILES_OLDER_THAN_SECONDS: ${DELETE_FILES_OLDER_THAN_SECONDS:-0}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8081:8080"
    networks:
      - sync_network
      - app_network
    depends_on:
      working-db:
        condition: service_healthy
      storage-db:
        condition: service_healthy

  # ============================================
  # VirusTotal Background Worker
  # ============================================
  vt-worker:
    build:
      context: ./FileTransfer
      dockerfile: Dockerfile
    container_name: openshare-vt-worker
    restart: always
    command: python3 vt_worker.py
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_ENABLED: ${VIRUSTOTAL_ENABLED:-true}
      VT_WORKER_INTERVAL: ${VT_WORKER_INTERVAL:-10}
      PYTHONUNBUFFERED: "1"
    networks:
      - app_network
    depends_on:
      working-db:
        condition: service_healthy

  # siem-dashboard is now integrated into the main app at /siem
  # The standalone container is no longer needed.
  # siem-dashboard:
  #   build:
  #     context: ./siem_dashboard
  #   container_name: openshare-siem-dashboard
  #   restart: always
  #   ports:
  #     - "5002:5001"
  #   environment:
  #     SIEM_URL: ${SIEM_URL}
  #     SIEM_DASHBOARD_SECRET: ${SIEM_DASHBOARD_SECRET}
  #   networks:
  #     - openshare-network

  # ============================================
  # Data Retention Service - Cleans up old files
  # ============================================
  retention-service:
    build:
      context: ./FileTransfer
      dockerfile: Dockerfile.retention
    container_name: openshare-retention
    restart: always
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      STORAGE_DB_HOST: storage-db
      STORAGE_DB_USER: ${STORAGE_DB_USER:-storage_user}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      STORAGE_DB_NAME: ${STORAGE_DB_NAME:-storagedb}
      STORAGE_DB_PORT: 3306
      RETENTION_CONFIG_PATH: /app/config/retention_policy.json
      UPLOAD_FOLDER: /app/uploads
      PYTHONUNBUFFERED: "1"
    volumes:
      - retention_config:/app/config
      - ./uploads:/app/uploads
    networks:
      - sync_network
      - app_network
    depends_on:
      working-db:
        condition: service_healthy
      storage-db:
        condition: service_healthy

networks:
  openshare-network:
    driver: bridge
  app_network:
    driver: bridge
  sync_network:
    driver: bridge
    internal: true

volumes:
  auth_db_data:
  working_db_data:
  storage_db_data:
  encryption_keys:
  retention_config:
  movelorh_db_data: