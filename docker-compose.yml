
version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:latest
    container_name: siem-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-siem_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-your_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - siem-network

  # SIEM/SOAR Flask Application
  siem:
    build: .
    container_name: siem-app
    restart: always
    ports:
      - "5001:5001"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_secure_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-siem_db}
      SECRET_KEY: ${SECRET_KEY:-change_this_in_production}
      USERS: ${USERS}
      FLASK_DEBUG: 1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reloading during development
      - .:/app
      # Append-only logs for tamper resistance
      - siem_logs:/app/logs:rw
    networks:
      - siem-network

volumes:
  mysql_data:
    driver: local
  siem_logs:
    driver: local

networks:
  siem-network:
    driver: bridge
