<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin - SIEM Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-logo">
                <div class="mascot-logo">
                    <div class="character-head">
                        <div class="eyes">
                            <div class="eye">
                                <div class="pupil"></div>
                            </div>
                            <div class="eye">
                                <div class="pupil"></div>
                            </div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                    <div class="hand-left-small"></div>
                    <div class="hand-right-small"></div>
                </div>
                <span class="brand-name">MoveIT</span>
                <span class="siem-tag">SIEM Dashboard</span>
            </div>
            <div class="nav-links">
                {% if username %}
                <span class="welcome-text">Logged in as {{ username }}</span>
                {% endif %}
                <a href="{{ url_for('dashboard') }}" class="nav-btn btn-outline">Dashboard</a>
                <a href="{{ url_for('add_admin') }}" class="nav-btn btn-outline">Add Admin</a>
                <a href="{{ url_for('logout') }}" class="nav-btn btn-primary">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container siem-container">
        <div class="card">
            <h2>Add Admin Account</h2>
            
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" class="admin-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                
                <button type="submit" class="submit-btn">Create Admin</button>
            </form>
        </div>
    </div>
</body>
</html>
