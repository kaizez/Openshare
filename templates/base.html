<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MoveIt - Secure File Sharing{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="#38A169"/>
                    <path d="M20 10L28 18H24V28H16V18H12L20 10Z" fill="white"/>
                </svg>
                <h1>MoveIt</h1>
            </div>
            {% include '_navbar.html' %}
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>&copy; 2024 MoveIt - Secure File Sharing Platform</p>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
