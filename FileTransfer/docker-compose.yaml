version: "3.9"

# ============================================
# OpenShare - Dual Database with Isolated Storage
# ============================================
# App        → Working DB only
# Working DB → Storage DB (via sync service)
# App CANNOT reach Storage DB directly
# ============================================

services:
  # ============================================
  # Working Database (DB1)
  # ============================================
  working-db:
    image: mysql:8.0
    container_name: openshare-working-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${WORKING_DB_ROOT_PASSWORD:-WorkingRoot2024!}
      MYSQL_DATABASE: ${WORKING_DB_NAME:-workingdb}
      MYSQL_USER: ${WORKING_DB_USER:-working_user}
      MYSQL_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
    volumes:
      - working_db_data:/var/lib/mysql
    networks:
      - app_network
      - sync_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Storage Database (DB2) - ISOLATED
  # ============================================
  # Only on sync_network - App CANNOT reach this
  storage-db:
    image: mysql:8.0
    container_name: openshare-storage-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${STORAGE_DB_ROOT_PASSWORD:-StorageRoot2024!}
      MYSQL_DATABASE: ${STORAGE_DB_NAME:-storagedb}
      MYSQL_USER: ${STORAGE_DB_USER:-storage_user}
      MYSQL_PASSWORD: ${STORAGE_DB_PASSWORD:-storage_pass_2024}
    volumes:
      - storage_db_data:/var/lib/mysql
    networks:
      - sync_network  # ONLY sync network - isolated from app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Sync Service - Bridges Working DB to Storage DB
  # ============================================
  # Only this service can talk to both databases
  sync-service:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: openshare-sync
    restart: always
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      STORAGE_DB_HOST: storage-db
      STORAGE_DB_USER: ${STORAGE_DB_USER:-storage_user}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:-storage_pass_2024}
      STORAGE_DB_NAME: ${STORAGE_DB_NAME:-storagedb}
      STORAGE_DB_PORT: 3306
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      DELETE_FILES_OLDER_THAN_SECONDS: ${DELETE_FILES_OLDER_THAN_SECONDS:-0}
    ports:
      - "8080:8080"
    volumes:
      # Development: Mount code for live editing (comment out for production)
      - ./sync_service.py:/app/sync_service.py
    networks:
      - sync_network  # Can reach both DBs
      - app_network  # Can receive requests from app
    depends_on:
      working-db:
        condition: service_healthy
      storage-db:
        condition: service_healthy

  # ============================================
  # Flask Application
  # ============================================
  # ONLY on app_network - cannot reach Storage DB
  app:
    build: .
    container_name: openshare-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      # No Storage DB config - app can't access it
      DUAL_DB_ENABLED: "false"
      SECRET_KEY: ${SECRET_KEY:-change_this_secret_key}
      DEBUG: ${DEBUG:-false}
      # VirusTotal scanning
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_ENABLED: ${VIRUSTOTAL_ENABLED:-true}
      VIRUSTOTAL_TIMEOUT: ${VIRUSTOTAL_TIMEOUT:-60}
      # Force Python to not buffer stdout/stderr
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./uploads:/app/uploads
      # Development: Mount code for live editing (comment out for production)
      - ./app.py:/app/app.py
      - ./db.py:/app/db.py
      - ./virustotal_service.py:/app/virustotal_service.py
      - ./templates:/app/templates
      - ./styles:/app/styles
    networks:
      - app_network  # ONLY app_network - cannot reach storage-db
    depends_on:
      working-db:
        condition: service_healthy

  # ============================================
  # VirusTotal Background Worker
  # ============================================
  # Processes pending virus scans in background
  vt-worker:
    build: .
    container_name: openshare-vt-worker
    restart: always
    command: python3 vt_worker.py
    environment:
      WORKING_DB_HOST: working-db
      WORKING_DB_USER: ${WORKING_DB_USER:-working_user}
      WORKING_DB_PASSWORD: ${WORKING_DB_PASSWORD:-working_pass_2024}
      WORKING_DB_NAME: ${WORKING_DB_NAME:-workingdb}
      WORKING_DB_PORT: 3306
      # VirusTotal configuration
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_ENABLED: ${VIRUSTOTAL_ENABLED:-true}
      VT_WORKER_INTERVAL: ${VT_WORKER_INTERVAL:-10}  # Check every 10 seconds
      # Force Python to not buffer stdout/stderr
      PYTHONUNBUFFERED: "1"
    volumes:
      # Development: Mount code for live editing (comment out for production)
      - ./vt_worker.py:/app/vt_worker.py
      - ./db.py:/app/db.py
      - ./virustotal_service.py:/app/virustotal_service.py
    networks:
      - app_network
    depends_on:
      working-db:
        condition: service_healthy

# ============================================
# Networks
# ============================================
networks:
  app_network:
    driver: bridge
  sync_network:
    driver: bridge
    internal: true  # Isolated - no external access

# ============================================
# Volumes
# ============================================
volumes:
  working_db_data:
  storage_db_data:
