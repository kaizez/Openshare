<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}MoveIt - Secure File Sharing{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('filetransfer.static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="{{ url_for('filetransfer.static', filename='logo.png') }}" alt="Progress MOVEit" height="40">
            </div>
            {% include 'filetransfer/_navbar.html' %}
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>&copy; 2024 MoveIt - Secure File Sharing Platform</p>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}

    {% if session.get('user_id') %}
    <script>
    // Location check for impossible travel detection - runs every 5 minutes
    (function() {
        async function checkLocation() {
            try {
                const response = await fetch('/check-location');
                const data = await response.json();

                if (data.status === 'locked') {
                    alert('Security Alert: ' + data.message);
                    window.location.href = '/login';
                }
            } catch (error) {
                console.log('Location check failed:', error);
            }
        }

        // Check every 5 minutes (300000 ms)
        setInterval(checkLocation, 300000);

        // Also check on page load
        checkLocation();
    })();
    </script>
    {% endif %}
</body>
</html>
