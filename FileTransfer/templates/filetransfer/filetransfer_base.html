<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}MoveIt - Secure File Sharing{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('filetransfer.static', filename='style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="{{ url_for('filetransfer.static', filename='logo.png') }}" alt="Progress MOVEit" height="40">
            </div>
            {% include 'filetransfer/_navbar.html' %}
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>&copy; 2024 MoveIt - Secure File Sharing Platform</p>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
