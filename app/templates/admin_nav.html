<!-- Shared Admin Navigation Bar -->
<style>
    .admin-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 220px;
        height: 100vh;
        background: #fff;
        border-right: 1px solid #edf2f7;
        padding: 0;
        display: flex;
        flex-direction: column;
        z-index: 100;
        overflow: visible;
        transition: width 0.2s ease;
    }

    .sidebar-inner {
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .admin-sidebar.collapsed {
        width: 56px;
    }

    /* Toggle button */
    .sidebar-toggle {
        position: absolute;
        top: 12px;
        right: -18px;
        width: 36px;
        height: 36px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 102;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        transition: background 0.15s, transform 0.2s;
        color: #4a5568;
    }

    .sidebar-toggle:hover { background: #f7fafc; }

    /* Arrow icon (expanded) */
    .sidebar-toggle .arrow-icon { display: flex; }
    .sidebar-toggle .hamburger-icon { display: none; }

    /* Hamburger icon (collapsed) */
    .admin-sidebar.collapsed .sidebar-toggle {
        position: fixed;
        top: 14px;
        left: 10px;
        right: auto;
    }
    .admin-sidebar.collapsed .sidebar-toggle .arrow-icon { display: none; }
    .admin-sidebar.collapsed .sidebar-toggle .hamburger-icon { display: flex; }

    .sidebar-toggle .hamburger-icon {
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .sidebar-toggle .hamburger-icon .bar {
        width: 18px;
        height: 2px;
        background: #4a5568;
        border-radius: 1px;
    }

    /* Header row */
    .sidebar-header {
        padding: 14px 12px;
        border-bottom: 1px solid #edf2f7;
        display: flex;
        align-items: center;
        min-height: 52px;
    }

    .sidebar-header .sidebar-brand {
        overflow: hidden;
        white-space: nowrap;
        transition: opacity 0.15s, width 0.2s;
    }

    .admin-sidebar.collapsed .sidebar-brand {
        opacity: 0;
        width: 0;
    }

    .sidebar-header h2 {
        font-size: 15px;
        font-weight: 800;
        color: #1a202c;
        margin: 0;
        letter-spacing: -0.3px;
    }

    .sidebar-header .brand-sub {
        font-size: 10px;
        color: #a0aec0;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .sidebar-section {
        padding: 0 8px;
        margin-bottom: 4px;
    }

    .sidebar-label {
        font-size: 9px;
        font-weight: 700;
        color: #a0aec0;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 10px 10px 4px;
        white-space: nowrap;
        overflow: hidden;
        transition: opacity 0.15s;
    }

    .admin-sidebar.collapsed .sidebar-label {
        opacity: 0;
        height: 0;
        padding: 0;
        margin: 0;
    }

    .admin-sidebar.collapsed .sidebar-link {
        justify-content: center;
        padding: 10px 0;
        gap: 0;
    }

    .admin-sidebar.collapsed .sidebar-section {
        padding: 0 4px;
    }

    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        color: #4a5568;
        transition: all 0.15s;
        margin-bottom: 1px;
        white-space: nowrap;
        position: relative;
    }

    .sidebar-link:hover {
        background: #f7fafc;
        color: #1a202c;
        text-decoration: none;
    }

    .sidebar-link.active {
        background: #38a169;
        color: #fff;
        font-weight: 600;
    }

    .sidebar-link.active:hover { background: #2f855a; }

    .sidebar-link svg {
        flex-shrink: 0;
        opacity: 0.7;
        min-width: 16px;
    }

    .sidebar-link.active svg { opacity: 1; }

    /* Link text */
    .sidebar-link .link-text {
        overflow: hidden;
        transition: opacity 0.15s, width 0.2s;
    }

    .admin-sidebar.collapsed .link-text {
        opacity: 0;
        width: 0;
    }

    /* Tooltip on collapsed hover */
    .admin-sidebar.collapsed .sidebar-link:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 52px;
        top: 50%;
        transform: translateY(-50%);
        background: #1a202c;
        color: #fff;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        z-index: 200;
        pointer-events: none;
    }

    .sidebar-footer {
        padding: 8px;
        border-top: 1px solid #edf2f7;
        margin-top: auto;
    }

    .sidebar-link.logout-link { color: #e53e3e; }
    .sidebar-link.logout-link:hover { background: rgba(229, 62, 62, 0.08); }

    /* Remove base.html container padding/width constraints for admin layout */
    body > .container {
        max-width: 100% !important;
        padding: 0 !important;
        width: 100% !important;
    }

    /* Push main content */
    .admin-container {
        margin-left: 220px !important;
        max-width: none !important;
        padding: 40px !important;
        transition: margin-left 0.2s ease;
        box-sizing: border-box;
        width: calc(100% - 220px) !important;
    }

    .admin-container.sidebar-collapsed {
        margin-left: 56px !important;
        width: calc(100% - 56px) !important;
    }

    /* Overlay when open on small screens */
    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.3);
        z-index: 99;
    }

    @media (max-width: 900px) {
        .admin-sidebar {
            transform: translateX(-220px);
        }

        .admin-sidebar.mobile-open {
            transform: translateX(0);
            width: 220px;
        }

        .admin-sidebar.collapsed {
            width: 220px;
        }

        .admin-container {
            margin-left: 0 !important;
            padding-top: 60px !important;
            width: 100% !important;
        }

        .admin-container.sidebar-collapsed {
            margin-left: 0 !important;
            width: 100% !important;
        }

        .sidebar-overlay.show { display: block; }

        .sidebar-toggle {
            top: 14px;
            right: auto;
            left: 14px;
            position: fixed;
        }
    }
</style>

<script>
(function() {
    var KEY = 'admin_sidebar_open';
    var sidebar = document.getElementById('adminSidebar');
    var overlay = document.getElementById('sidebarOverlay');
    var container = document.querySelector('.admin-container');
    var isMobile = window.innerWidth <= 900;

    var saved = localStorage.getItem(KEY);
    var isOpen = isMobile ? false : (saved !== '0');

    function apply() {
        if (isOpen) {
            sidebar.classList.remove('collapsed');
            sidebar.classList.add('mobile-open');
            if (container) container.classList.remove('sidebar-collapsed');
            if (isMobile) overlay.classList.add('show');
        } else {
            sidebar.classList.add('collapsed');
            sidebar.classList.remove('mobile-open');
            if (container) container.classList.add('sidebar-collapsed');
            overlay.classList.remove('show');
        }
    }

    apply();

    window.toggleSidebar = function() {
        isOpen = !isOpen;
        localStorage.setItem(KEY, isOpen ? '1' : '0');
        apply();
    };

    window.addEventListener('resize', function() {
        isMobile = window.innerWidth <= 900;
    });
})();
</script>
