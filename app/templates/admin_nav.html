<!-- Shared Admin Navigation Bar -->
<style>
    .admin-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 220px;
        height: 100vh;
        background: #fff;
        border-right: 1px solid #edf2f7;
        padding: 0;
        display: flex;
        flex-direction: column;
        z-index: 100;
        overflow-y: auto;
        transition: width 0.2s ease, transform 0.2s ease;
    }

    .admin-sidebar.collapsed {
        transform: translateX(-220px);
    }

    /* Hamburger toggle */
    .sidebar-hamburger {
        position: fixed;
        top: 14px;
        left: 14px;
        width: 36px;
        height: 36px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        cursor: pointer;
        z-index: 102;
        box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        transition: background 0.15s;
    }

    .sidebar-hamburger:hover { background: #f7fafc; }

    .sidebar-hamburger .bar {
        width: 18px;
        height: 2px;
        background: #4a5568;
        border-radius: 1px;
        transition: all 0.2s;
    }

    .sidebar-hamburger.open .bar:nth-child(1) {
        transform: rotate(45deg) translate(4px, 4px);
    }
    .sidebar-hamburger.open .bar:nth-child(2) { opacity: 0; }
    .sidebar-hamburger.open .bar:nth-child(3) {
        transform: rotate(-45deg) translate(4px, -4px);
    }

    /* Header row */
    .sidebar-header {
        padding: 14px 16px 14px 54px;
        border-bottom: 1px solid #edf2f7;
        display: flex;
        align-items: center;
    }

    .sidebar-header h2 {
        font-size: 15px;
        font-weight: 800;
        color: #1a202c;
        margin: 0;
        letter-spacing: -0.3px;
    }

    .sidebar-header span {
        font-size: 10px;
        color: #a0aec0;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-left: 8px;
    }

    .sidebar-section {
        padding: 0 10px;
        margin-bottom: 4px;
    }

    .sidebar-label {
        font-size: 9px;
        font-weight: 700;
        color: #a0aec0;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 10px 10px 4px;
    }

    .sidebar-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        color: #4a5568;
        transition: all 0.15s;
        margin-bottom: 1px;
        white-space: nowrap;
    }

    .sidebar-link:hover {
        background: #f7fafc;
        color: #1a202c;
        text-decoration: none;
    }

    .sidebar-link.active {
        background: #38a169;
        color: #fff;
        font-weight: 600;
    }

    .sidebar-link.active:hover { background: #2f855a; }

    .sidebar-link svg {
        flex-shrink: 0;
        opacity: 0.7;
    }

    .sidebar-link.active svg { opacity: 1; }

    .sidebar-footer {
        padding: 10px;
        border-top: 1px solid #edf2f7;
        margin-top: auto;
    }

    .sidebar-link.logout-link { color: #e53e3e; }
    .sidebar-link.logout-link:hover { background: rgba(229, 62, 62, 0.08); }

    /* Push main content */
    .admin-container {
        margin-left: 220px !important;
        max-width: none !important;
        padding: 40px 40px !important;
        transition: margin-left 0.2s ease;
    }

    .admin-container.sidebar-collapsed {
        margin-left: 0 !important;
        padding-top: 60px !important;
    }

    /* Overlay when open on small screens */
    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.3);
        z-index: 99;
    }

    @media (max-width: 900px) {
        .admin-sidebar {
            transform: translateX(-220px);
        }

        .admin-sidebar.mobile-open {
            transform: translateX(0);
        }

        .admin-container {
            margin-left: 0 !important;
            padding-top: 60px !important;
        }

        .sidebar-overlay.show { display: block; }
    }
</style>

<script>
(function() {
    var KEY = 'admin_sidebar_open';
    var sidebar = document.getElementById('adminSidebar');
    var hamburger = document.getElementById('sidebarHamburger');
    var overlay = document.getElementById('sidebarOverlay');
    var container = document.querySelector('.admin-container');
    var isMobile = window.innerWidth <= 900;

    // Default: open on desktop, closed on mobile
    var saved = localStorage.getItem(KEY);
    var isOpen = isMobile ? false : (saved !== '0');

    function apply() {
        if (isOpen) {
            sidebar.classList.remove('collapsed');
            sidebar.classList.add('mobile-open');
            hamburger.classList.add('open');
            if (container) container.classList.remove('sidebar-collapsed');
            if (isMobile) overlay.classList.add('show');
        } else {
            sidebar.classList.add('collapsed');
            sidebar.classList.remove('mobile-open');
            hamburger.classList.remove('open');
            if (container) container.classList.add('sidebar-collapsed');
            overlay.classList.remove('show');
        }
    }

    apply();

    window.toggleSidebar = function() {
        isOpen = !isOpen;
        localStorage.setItem(KEY, isOpen ? '1' : '0');
        apply();
    };

    window.addEventListener('resize', function() {
        isMobile = window.innerWidth <= 900;
    });
})();
</script>
