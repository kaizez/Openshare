<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Authentication System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/character.css') }}">
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/eye-tracker.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form-validation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tutorial.js') }}"></script>

    {% if session.get('user_id') %}
    <script>
    // Location check for impossible travel detection - runs every 5 minutes
    (function() {
        async function checkLocation() {
            try {
                const response = await fetch('/check-location');
                const data = await response.json();

                if (data.status === 'locked') {
                    alert('Security Alert: ' + data.message);
                    window.location.href = '/login';
                }
            } catch (error) {
                console.log('Location check failed:', error);
            }
        }

        // Check every 5 minutes (300000 ms)
        setInterval(checkLocation, 300000);

        // Also check on page load
        checkLocation();
    })();
    </script>
    {% endif %}
</body>
</html>
