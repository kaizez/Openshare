{% extends "base.html" %}

{% block title %}SIEM — Add Admin{% endblock %}

{% block content %}
{% set active_page = 'siem' %}{% include 'admin_nav.html' %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/siem_dashboard.css') }}">

<div class="admin-container">
    <div style="max-width:480px; margin:60px auto;">
        <div style="margin-bottom:16px;">
            <a href="{{ url_for('siem.siem_dashboard') }}"
               style="font-size:13px; color:#38a169; text-decoration:none;">&larr; Back to Dashboard</a>
        </div>
        <div class="card">
            <h2>Add SIEM Admin Account</h2>

            {% if error %}
            <div style="background:#fff5f5; color:#c53030; border-left:4px solid #fc8181; border-radius:4px; padding:12px 14px; margin-bottom:18px; font-size:14px;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required
                           style="width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box;">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required
                           style="width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box;">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" required
                           style="width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box;">
                </div>
                <button type="submit"
                        style="width:100%; padding:11px; background:linear-gradient(135deg,#48bb78,#38a169); color:#fff; border:none; border-radius:6px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;">
                    Create Admin
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
